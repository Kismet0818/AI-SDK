# AIChatServer 配置文件

# 服务器绑定地址
--host=0.0.0.0

# 服务器监听端口
--port=8081

# 日志级别 (DEBUG, INFO, WARN, ERROR)
--log_level=INFO

# 生成文本的温度值 (0.0 - 2.0)
--temperature=0.7

# 生成文本的最大 Token 数
--max_tokens=2048

# Ollama 本地模型名称
--ollama_model=deepseek-r1:1.5b

# Ollama 模型描述
--ollama_desc=本地部署的推理模型

# Ollama API 服务地址
--ollama_endpoint=http://localhost:11434
