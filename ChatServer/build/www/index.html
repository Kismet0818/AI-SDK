<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天助手</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 代码高亮库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 引入 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <span>AI聊天助手</span>
                </div>
                <button id="new-chat-btn-top" class="btn-primary">
                    <i class="fas fa-plus"></i> 新建对话
                </button>
            </div>
            <div id="session-list" class="session-list">
                <!-- 会话列表项将在这里动态生成 -->
            </div>
        </aside>

        <!-- 右侧主界面 -->
        <main class="main-content">
            <!-- 初始状态 -->
            <div id="welcome-view" class="welcome-view">
                <div class="welcome-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <p>选择一个历史对话继续，或创建新的对话，开启您的AI之旅</p>
                <button id="new-chat-btn-main" class="btn-primary">新建对话</button>
            </div>

            <!-- 聊天状态 -->
            <div id="chat-view" class="chat-view hidden">
                <div id="chat-messages" class="chat-messages">
                    <!-- 消息将在这里动态生成 -->
                </div>
                <div class="input-area">
                    <div class="input-container">
                        <textarea id="message-input" placeholder="请输入您的消息...(Enter发送，Shift+Enter换行)" maxlength="2000"></textarea>
                        <div class="input-footer">
                            <span id="char-count">0/2000</span>
                            <button id="send-btn" disabled>
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 模型选择模态框 -->
    <div id="model-modal" class="modal hidden">
        <div class="modal-content">
            <h3>选择对话模型</h3>
            <div id="model-grid" class="model-grid">
                <!-- 模型单选框将在这里动态生成 -->
            </div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn-secondary">取消</button>
                <button id="modal-confirm" class="btn-primary">确定</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
